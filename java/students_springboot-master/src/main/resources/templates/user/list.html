<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" th:href="@{/static/layui/css/layui.css}">
</head>
<body>
<div class="demoTable layui-form">
    <div class="layui-form-item">
        <div class="layui-inline">
            <label class="layui-form-label">用户名</label>
            <div class="layui-input-inline">
                <input type="text" name="userName" id="userName" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-inline">
            <label class="layui-form-label">昵称</label>
            <div class="layui-input-inline">
                <input type="text" name="nickName" id="nickName" autocomplete="off" class="layui-input">
            </div>
        </div>
        <button class="layui-btn" data-type="reload">搜索</button>
    </div>
</div>

<table class="layui-hide" id="test" lay-filter="user_bar"></table>
<script type="text/html" id="toolbarDemo">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm" lay-event="add">
            <i class="layui-icon">&#xe608;</i>新增
        </button>
    </div>
</script>
<script type="text/html" id="barDemo">
    <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
</script>
<!--加载添加页面-->
<div th:replace="user/add :: add"></div>
<!--加载编辑页面-->
<div th:replace="user/edit :: edit"></div>
</body>
<script th:src="@{/static/js/jquery.js}"></script>
<script th:src="@{/static/layui/layui.js}"></script>
<script  th:src="@{/static/js/common.js}"></script>
<script th:inline="none">
    layui.use(['table', 'form'], function () {
        var table = layui.table;
        var form = layui.form;
        var layer = layui.layer;
        var index;
        table.render({
            elem: '#test',
            id: 'testReload',
            url: '/user/list',
            toolbar: '#toolbarDemo', //开启头部工具栏，并为其绑定左侧模板
            defaultToolbar: ['filter', 'exports', 'print', { //自定义头部工具栏右侧图标。如无需自定义，去除该参数即可
                title: '提示',
                layEvent: 'LAYTABLE_TIPS',
                icon: 'layui-icon-tips'
            }],
            method: 'get',
            cellMinWidth: 80, //全局定义常规单元格的最小宽度，layui 2.2.1 新增
            cols: [[
                {field: 'id', title: 'ID', sort: true},
                {field: 'userName', title: '用户名'},
                {field: 'nickName', title: '昵称'},
                {fixed: 'right', title: '操作', align: 'center', toolbar: '#barDemo'}
            ]],
            page: true,//开启分页
            limit: 10,//每页显示条数
            limits: [10, 20, 30, 40]
        });
        var $ = layui.$, active = {
            reload: function () {
                //执行重载
                table.reload('testReload', {
                    page: {
                        curr: 1 //重新从第 1 页开始
                    },
                    where: {
                        account: $("#userName").val(),
                        nickName: $("#nickName").val()
                    }
                });
            }
        };

        $('.demoTable .layui-btn').on('click', function () {
            var type = $(this).data('type');
            active[type] ? active[type].call(this) : '';
        });
        //toolbar头工具栏事件，user_bar是table标签中的lay-filter
        table.on('toolbar(user_bar)', function (obj) {
            switch (obj.event) {
                //add是button按钮找那个的lay-event
                case 'add':
                    index = layer.open({
                        type: 1,//页面层
                        title: '用户添加',
                        content: $('#addDiv')//#addDiv是div标签的id为addDiv
                    });
                    break;
            }
        });

        //监听行工具事件
        table.on('tool(user_bar)', function (obj) {
            var data = obj.data;
            var id = data.id;
            if (obj.event === 'del') {
                layer.confirm('真的删除行么', function (index) {
                    $.ajax({
                        type: "GET",
                        url: '/user/del?id='+id,//后台接口地址
                        // data: data.id,
                        success: function (result) {
                            if (result.code === 0) {
                                obj.del();
                                layer.close(index);
                                layer.msg(result.msg, {icon: 1,time: 2000});
                            } else {  //失败
                                layer.alert(result.msg, {icon: 2}, function () {
                                    layer.close(index);
                                });
                            }
                        }
                    })
                });
            } else if (obj.event === 'edit') {
                index = layer.open({
                    type: 1,//页面层
                    title: '用户编辑',
                    content: $('#editDiv'),
                    success:function () {
                        $('#editDiv').setForm(data);
                    }
                });
            }
        });

        //自定义验证规则
        form.verify({
            pass: function (value) {
                var id = $("#id").val();
                var oldPwd = $("#oldUserPwd").val();//旧的密码
                if((value == null && value === '') || (id != null && oldPwd !== value)){
                    var reg = /^[\S]{6,12}$/;
                    if(!reg.test(value)){
                        return '密码必须6到12位，且不能出现空格';
                    }
                }
            }
            // pass: [
            //     /^[\S]{6,12}$/
            //     , '密码必须6到12位，且不能出现空格'
            // ]
        });
        //添加或者修改
        form.on('submit(update_submit)', function (data) {

            $.ajax({
                type: "POST",
                url: '/user/handling',//后台接口地址
                contentType: "application/json; charset=utf-8",//提交数据的格式为json
                data: JSON.stringify(data.field),//格式化为json串
                // dataType: "json",//返回的result数据格式为json串
                // data: form.val('example'),
                success: function (result) {
                    if (result.code === 0) {
                        //成功后刷新父界面
                        window.location.reload();
                        layer.msg(result.msg, {icon: 1, time: 2000});
                    } else {  //失败
                        layer.alert(result.msg, {icon: 2}, function () {
                            layer.close(index);
                        });
                    }
                }
            });
            layer.close(index);//关闭弹出层
            return false;
        });

    });
</script>
</html>
