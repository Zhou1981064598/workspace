<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录</title>
    <!-- 引入 layui.css -->
    <link rel="stylesheet" th:href="@{/static/layui/css/layui.css}"/>
    <link rel="stylesheet" th:href="@{/static/css/login.css}">
    <!-- 引入 layui.js -->
    <script th:src="@{/static/layui/layui.js}"></script>
</head>
<body>
<div id="login_box">
    <h2>智能学生管理系统 </h2>
    <form id="form" action="/index" method="post">
        <div class="input_box">
            <i class="fa fa-user" aria-hidden="true"></i>
            <input class="in" type="text" placeholder="请输入用户名" name="userName">
        </div>
        <div class="input_box">
            <i class="fa fa-key" aria-hidden="true"></i>
            <input class="in" type="password" placeholder="请输入密码" name="pwd">
        </div>
        <button id="btn" type="submit">Sign in</button>
        <br>
        <p>
            <span id="error" style="color:red;font-size: 15px" th:text="${msg}"></span>
        </p>
    </form>
</div>
</body>
</html>
