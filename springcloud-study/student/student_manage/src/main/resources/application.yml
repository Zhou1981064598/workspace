# 服务端口
server:
  port: 8089
spring:
  main:
    #    删除bean之间的依赖循环
    allow-circular-references: true
      #  数据库的连接信息
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/students_db?serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&useUnicode=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  application:
      name: student
  cloud:
      nacos:
        discovery:
          server-addr: localhost:8848
  profiles:
  #    配置静态模板
  thymeleaf:
    prefix: classpath:/templates/
    mode: HTML5
    suffix: .html
    cache: false # 模板引擎的缓存
  mvc:
    static-path-pattern: /static/**
  # jpa配置
  jpa:
    database: mysql
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQL5Dialect

mybatis-plus:
  configuration:
    #  打开执行SQL的日志（打印执行sql）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 开启驼峰式命名规则
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 表名前缀 ，全局配置后可以省略@Table(name = "t_user")配置
      table-prefix: t_
      # 全局默认主键类型，设置后可以省略@TableId(type = IdType.AUTO)配置
      id-type: auto
  # mybatis mapper 对应的xml文件位置
  mapper-locations: classpath:mapper/*.xml

