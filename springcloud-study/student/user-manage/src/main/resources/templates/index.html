<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>学生管理系统</title>
    <link rel="stylesheet" th:href="@{/static/layui/css/layui.css}">
    <style>
        .layui-tab-content {
            /*默认有padding: 10;的值，因为iframe的绝对定位脱离⽂档流，所以会存在20px的空⽩空间*/
            padding: 0;
        }

        .show-frame {
            top: 50px !important;
            /*消除浏览器最右边的滚动条*/
            overflow: hidden;
        }

        #demoAdmin {
            position: absolute;
            /*与layui-footer 隔开⼀段距离*/
            padding: 10px;
            width: 100%;
            height: 100%;
            border-radius: 2px;
        }
    </style>
</head>
<body>
<div class="layui-layout layui-layout-admin">
    <div class="layui-header">
        <div class="layui-logo layui-hide-xs layui-bg-black">学生管理系统</div>
        <!-- 头部区域（可配合layui 已有的水平导航） -->
        <ul class="layui-nav layui-layout-right">
            <li class="layui-nav-item layui-hide layui-show-md-inline-block">
                <a href="javascript:;">
                    <img th:src="@{/static/img/logo.png}" class="layui-nav-img">
                    <span th:text="${nickName}"></span>
                </a>
            </li>
        </ul>
    </div>

    <div class="layui-side layui-bg-black">
        <div class="layui-side-scroll">
            <!-- 左侧导航区域（可配合layui已有的垂直导航） -->
            <ul class="layui-nav layui-nav-tree" lay-filter="test">
                <li class="layui-nav-item layui-nav-itemed">
                    <a class="" th:href="@{/index_x}" id="firstYe" target="frameName">首页</a>
                </li>
                <li class="layui-nav-item">
                    <a href="javascript:;">系统管理</a>
                    <dl class="layui-nav-child">
                        <dd><a th:href="@{/user/toList}" target="frameName">用户管理</a></dd>
                    </dl>
                </li>
                <li class="layui-nav-item">
                    <a href="javascript:;">学生管理</a>
                    <dl class="layui-nav-child">
                        <dd><a th:href="@{/tiaozhuan/students/tolist}" target="frameName">学生管理</a></dd>
                        <dd><a th:href="@{tiaozhuan/building/tolist}" target="frameName">宿舍管理</a></dd>
                        <dd><a th:href="@{tiaozhuan/score/tolist}" target="frameName">成绩管理</a></dd>
                    </dl>
                </li>
            </ul>
        </div>
    </div>

    <div class="layui-body show-frame">
        <!-- 内容 -->
        <div class="layui-tab-content">
            <div class="layui-tab-item layui-show">
                <!-- 内容主体区域 -->
                <div style="padding: 15px;">
                    <iframe frameborder="0" id="demoAdmin" name="frameName" scrolling="no" th:src="@{/index_x}">
                    </iframe>
                </div>
            </div>
        </div>
    </div>

    <div class="layui-footer">
        <!-- 底部固定区域 -->
        底部固定区域
    </div>
</div>
<script th:src="@{/static/js/jquery.js}"></script>
<script th:src="@{/static/layui/layui.js}"></script>
<script>
    //JS
    // $(document).ready(function () {
    //     $("dd>a").click(function (e) {
    //         e.preventDefault();//阻止默认操作
    //         $('#demoAdmin').attr("th:src", $(this).attr("th:href"));
    //     });
    // });
</script>
</body>
</html>
